name: Rust Library CI
on:
  workflow_call:

    inputs:
      config-path:
        type: string
        default: ''
        description: |
          File path to write the CONFIG secret to before running tests.

          - If empty (default), no config file is written
          - Requires the CONFIG secret to be set
          - Example: config.yml
      publish:
        type: boolean
        default: true
        description: |
          Whether to publish to crates.io on stable release.

          - Set to false for crates that should not be published
          - Requires the CARGO_REGISTRY_TOKEN secret when true
      cargo-manifests:
        type: string
        default: |
          Cargo.toml
          Cargo.lock
        description: |
          Paths of all Cargo.toml and Cargo.lock files.

          - Downloaded in cargo-build and cargo-publish to overlay the version-stamped files onto the checkout
          - Cargo.lock must be included because --locked is used everywhere and cargo-set-version updates it when stamping the version
          - For workspace crates, include all member Cargo.toml files
      ref:
        type: string
        default: ''
        description: |
          Git ref to checkout.

          - If empty (default), uses the ref that triggered the workflow

    secrets:
      RELEASE_TOKEN:
        required: true
        description: GitHub token for release detection.
      RELEASE_SCRIPT:
        required: true
        description: |
          Script that determines the version and writes release notes to /tmp/release-notes.md.

          - Must set the output: version
      CARGO_REGISTRY_TOKEN:
        required: false
        description: |
          crates.io authentication token.

          - Required when publish is true
      CONFIG:
        required: false
        description: |
          Content written to config-path before tests.

          - Required when config-path is set
      GIT_CONFIG:
        required: false
        description: |
          Git config commands run before git tag to configure signing.

          - Example: tag.gpgSign, user.signingkey
          - If unset, a lightweight unsigned tag is created

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
jobs:

  # Determine version, update manifests and upload as artifact
  release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:

    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0
        fetch-tags: true

    - id: release
      if: startsWith(github.event_name, 'pull_request') == false
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      run: ${{ secrets.RELEASE_SCRIPT }}

    - if: startsWith(github.event_name, 'pull_request')
      run: touch /tmp/release-notes.md

    - run: echo "# ${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY

    - run: cat /tmp/release-notes.md >> $GITHUB_STEP_SUMMARY

    - uses: actions/upload-artifact@v4
      with:
        name: release-notes.md
        path: /tmp/release-notes.md

    - run: /home/linuxbrew/.linuxbrew/bin/brew install cargo-edit
      if: steps.release.outputs.version != ''

    - run: /home/linuxbrew/.linuxbrew/bin/cargo-set-version set-version ${{ steps.release.outputs.version }}
      if: steps.release.outputs.version != ''

    - run: git --no-pager diff --color

    - uses: actions/upload-artifact@v4
      with:
        name: cargo-manifests
        path: ${{ inputs.cargo-manifests }}

  # Build and test
  #
  # Cache strategy:
  # - Restored every run with key cargo-<run_number>, falling back to any cargo- prefix.
  # - Saved only on main branch.
  # - Incremental build artifacts are removed
  # - Stale caches are deleted via gh cache delete.
  cargo-build:
    runs-on: ubuntu-24.04
    needs:
    - release
    steps:

    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - name: Restore cargo cache
      id: cache-cargo
      uses: actions/cache/restore@v4
      with:
        key: cargo-${{ github.run_number }}
        restore-keys: cargo-
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/

    - uses: actions/download-artifact@v4
      with:
        name: cargo-manifests

    - run: git --no-pager diff --color

    - run: cargo build --release --locked --all-features --tests

    - name: Run cargo check
      run: |
        if ! cargo check --quiet --locked --all-targets --all-features --message-format short
        then
          echo "::warning title=Cargo Check Failed::Please review the output for details."
        fi

    - name: Run cargo clippy
      run: |
        if ! cargo clippy --quiet --locked --all-targets --all-features --message-format short
        then
          echo "::warning title=Clippy Check Failed::Please review the output for details."
        fi

    - name: Run cargo fmt
      run: |
        if ! cargo fmt --check
        then
          echo "::warning title=Format Check Failed::Please review the output for details."
        fi

    - name: Clean cargo cache
      if: github.ref_name == 'main'
      run: rm -rf target/*/release/incremental

    - name: Delete stale cargo caches
      if: github.ref_name == 'main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh cache list --key cargo- --json key --jq '.[].key' -R ${{ github.repository }} |
        while read -r key; do
          gh cache delete "$key" -R ${{ github.repository }}
        done

    - name: Save cargo cache
      if: github.ref_name == 'main'
      uses: actions/cache/save@v4
      with:
        key: ${{ steps.cache-cargo.outputs.cache-primary-key }}
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/

    - name: Write config
      if: inputs.config-path != ''
      run: |
        tee ${{ inputs.config-path }} <<EOF
        ${{ secrets.CONFIG }}
        EOF

    - run: cargo test --release --locked --no-fail-fast --all-features

    - run: git --no-pager diff --color

  # Publish to crates.io
  #
  # Runs when: publish input is true, version is set, and version is stable (no hyphen)
  cargo-publish:
    runs-on: ubuntu-24.04
    if: inputs.publish && needs.release.outputs.version != '' && contains(needs.release.outputs.version, '-') == false
    needs:
    - release
    - cargo-build
    steps:

    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - uses: actions/download-artifact@v4
      with:
        name: cargo-manifests

    - run: git --no-pager diff --color

    - run: cargo publish --allow-dirty --locked --no-verify
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Tag prereleases
  #
  # Runs when: version is set and version is a prerelease (contains hyphen)
  git-tag:
    runs-on: ubuntu-24.04
    if: needs.release.outputs.version != '' && contains(needs.release.outputs.version, '-')
    needs:
    - release
    - cargo-build
    steps:

    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0
        fetch-tags: true

    - name: git config
      run: ${{ secrets.GIT_CONFIG || 'true' }}

    - run: git config --list

    - name: git tag
      run: git tag -m "v${{ needs.release.outputs.version }}" "v${{ needs.release.outputs.version }}"

    - name: git push
      run: git push origin "v${{ needs.release.outputs.version }}"

  # Create GitHub release
  #
  # Runs when: version is set and version is stable (no hyphen)
  github-release:
    runs-on: ubuntu-24.04
    if: needs.release.outputs.version != '' && contains(needs.release.outputs.version, '-') == false
    needs:
    - release
    - cargo-build
    steps:

    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - uses: actions/download-artifact@v4
      with:
        name: release-notes.md

    - name: gh release create
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh release create
        "v${{ needs.release.outputs.version }}"
        --title "v${{ needs.release.outputs.version }}"
        --notes-file release-notes.md
        --target ${{ github.ref_name }}
