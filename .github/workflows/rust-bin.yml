name: Rust Binary CI
on:
  workflow_call:

    inputs:
      binary-name:
        type: string
        required: true
        description: Name of the binary for artifact packaging.
      targets:
        type: string
        default: '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","test":true}]'
        description: |
          JSON array of build targets.

          Each object has:
          - os: Runner OS (e.g. ubuntu-24.04, macos-15)
          - target: Rust target triple (e.g. x86_64-unknown-linux-gnu)
          - test: Whether to run tests on this target (optional, default false)
      cargo-manifests:
        type: string
        default: |
          Cargo.toml
          Cargo.lock
        description: |
          Paths of all Cargo.toml and Cargo.lock files.

          - Downloaded in cargo-build and cargo-publish to overlay the version-stamped files onto the checkout
          - Cargo.lock must be included because --locked is used everywhere and cargo-set-version updates it when stamping the version
          - For workspace crates, include all member Cargo.toml files
      config-path:
        type: string
        default: ''
        description: |
          File path to write the CONFIG secret to before running tests.

          - If empty (default), no config file is written
          - Requires the CONFIG secret to be set
      cargo-publish:
        type: boolean
        default: true
        description: |
          Whether to publish to crates.io on stable release.

          - Requires the CARGO_REGISTRY_TOKEN secret when true
      workspace:
        type: boolean
        default: false
        description: |
          Whether this is a Cargo workspace.

          - Adds --workspace to cargo-set-version and cargo publish
      docker-image:
        type: string
        default: ''
        description: |
          Docker image name for GHCR (e.g. rogueoneecho/coda).

          - If empty (default), Docker jobs are skipped
          - Each project must have its own Dockerfile
      pre-test:
        type: string
        default: ''
        description: |
          Shell commands to run before cargo test on each test target.

          - Runs only on targets with test: true
          - Example: brew install flac lame sox_ng
      post-test:
        type: string
        default: ''
        description: |
          Shell commands to run after cargo test on each test target.

          - Runs only on targets with test: true
          - Example: cargo test -p my_macros --release --locked --target $TARGET
      sbom:
        type: string
        default: ''
        description: |
          Path to a source-deps CycloneDX SBOM to merge with the container SBOM.

          - If empty (default), only the container SBOM is used
          - Example: .github/sbom/source-deps.cdx.json

    secrets:
      RELEASE_TOKEN:
        required: true
        description: GitHub token for release detection.
      RELEASE_SCRIPT:
        required: true
        description: |
          Script that determines the version and writes release notes to /tmp/release-notes.md.

          - Must set the output: version
      CARGO_REGISTRY_TOKEN:
        required: false
        description: |
          crates.io authentication token.

          - Required when cargo-publish is true
      CONFIG:
        required: false
        description: |
          Content written to config-path before tests.

          - Required when config-path is set
      GIT_CONFIG:
        required: false
        description: |
          Git config commands run before git tag to configure signing.

          - If unset, a lightweight unsigned tag is created

    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}
        description: The resolved version string.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
jobs:

  release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - id: release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      run: ${{ secrets.RELEASE_SCRIPT }}

    - if: github.event_name != 'push'
      run: touch /tmp/release-notes.md

    - run: echo "# ${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY

    - run: cat /tmp/release-notes.md >> $GITHUB_STEP_SUMMARY

    - uses: actions/upload-artifact@v4
      with:
        name: release-notes.md
        path: /tmp/release-notes.md

    - run: /home/linuxbrew/.linuxbrew/bin/brew install cargo-edit
      if: steps.release.outputs.version != ''

    - run: /home/linuxbrew/.linuxbrew/bin/cargo-set-version set-version ${{ inputs.workspace && '--workspace' || '' }} ${{ steps.release.outputs.version }}
      if: steps.release.outputs.version != ''

    - run: git --no-pager diff --color

    - uses: actions/upload-artifact@v4
      with:
        name: cargo-manifests
        path: ${{ inputs.cargo-manifests }}

  cargo-build:
    runs-on: ${{ matrix.os }}
    needs:
    - release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    steps:

    - uses: actions/checkout@v4

    - name: Restore cargo cache
      id: cache-cargo
      uses: actions/cache/restore@v4
      with:
        key: cargo-${{ matrix.target }}-${{ github.run_number }}
        restore-keys: cargo-${{ matrix.target }}-
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/

    - uses: actions/download-artifact@v4
      with:
        name: cargo-manifests

    - run: git --no-pager diff --color

    - if: contains(matrix.os, 'ubuntu')
      run: echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

    - if: contains(matrix.os, 'ubuntu')
      run: sudo apt-get update

    - if: contains(matrix.target, 'musl')
      run: sudo apt-get install musl-tools --yes

    - run: rustup target add ${{ matrix.target }}

    - run: brew install cargo-auditable

    - run: cargo auditable build --release --locked --target ${{ matrix.target }} --bins ${{ matrix.test && '--tests' || '' }}
      env:
        PKG_CONFIG_ALLOW_CROSS: 1

    - name: Clean cargo cache
      if: github.ref_name == 'main'
      run: rm -rf target/*/release/incremental

    - name: Delete stale cargo caches
      if: github.ref_name == 'main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh cache list --key cargo-${{ matrix.target }}- --json key --jq '.[].key' -R ${{ github.repository }} |
        while read -r key; do
          gh cache delete "$key" -R ${{ github.repository }}
        done

    - name: Save cargo cache
      if: github.ref_name == 'main'
      uses: actions/cache/save@v4
      with:
        key: ${{ steps.cache-cargo.outputs.cache-primary-key }}
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/

    - run: mkdir artifacts

    - name: Package binary as tar.xz
      run: |
        cp target/${{ matrix.target }}/release/${{ inputs.binary-name }} artifacts/${{ inputs.binary-name }}
        tar -cJf artifacts/${{ inputs.binary-name }}-${{ needs.release.outputs.version }}-${{ matrix.target }}.tar.xz \
          -C artifacts ${{ inputs.binary-name }}

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.binary-name }}-${{ needs.release.outputs.version }}-${{ matrix.target }}
        path: artifacts/${{ inputs.binary-name }}-${{ needs.release.outputs.version }}-${{ matrix.target }}.tar.xz

    - run: rm -rf artifacts

    - name: Pre-test setup
      if: matrix.test && inputs.pre-test != ''
      run: ${{ inputs.pre-test }}
      env:
        TARGET: ${{ matrix.target }}

    - name: Write config
      if: matrix.test && inputs.config-path != ''
      run: |
        tee ${{ inputs.config-path }} <<EOF
        ${{ secrets.CONFIG }}
        EOF

    - if: matrix.test
      run: cargo auditable test --release --locked --no-fail-fast --target ${{ matrix.target }}
      env:
        CLICOLOR_FORCE: 1

    - name: Post-test
      if: matrix.test && inputs.post-test != ''
      run: ${{ inputs.post-test }}
      env:
        TARGET: ${{ matrix.target }}

    - name: Run cargo check
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: |
        if ! cargo check --quiet --locked --all-targets --message-format short
        then
          echo "::warning title=Cargo Check Failed::Please review the output for details."
        fi

    - name: Run cargo clippy
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: |
        if ! cargo clippy --quiet --locked --all-targets --message-format short
        then
          echo "::warning title=Clippy Check Failed::Please review the output for details."
        fi

    - name: Run cargo fmt
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: |
        if ! cargo fmt --check
        then
          echo "::warning title=Format Check Failed::Please review the output for details."
        fi

    - if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: brew install cargo-audit

    - name: Run cargo audit
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: |
        if ! cargo audit bin target/${{ matrix.target }}/release/${{ inputs.binary-name }}
        then
          echo "::warning title=Vulnerability Scan Failed::Please review the output for details."
        fi

    - run: git --no-pager diff --color

  cargo-publish:
    runs-on: ubuntu-24.04
    if: inputs.cargo-publish && needs.release.outputs.version != '' && contains(needs.release.outputs.version, '-') == false
    needs:
    - release
    - cargo-build
    steps:

    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: cargo-manifests

    - run: git --no-pager diff --color

    - run: cargo publish --allow-dirty --locked --no-verify ${{ inputs.workspace && '--workspace' || '' }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  git-tag:
    runs-on: ubuntu-24.04
    if: needs.release.outputs.version != '' && contains(needs.release.outputs.version, '-')
    needs:
    - release
    - cargo-build
    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: git config
      run: ${{ secrets.GIT_CONFIG || 'true' }}

    - run: git config --list

    - name: git tag
      run: git tag "v${{ needs.release.outputs.version }}"

    - name: git push
      run: git push origin "v${{ needs.release.outputs.version }}"

  github-release:
    runs-on: ubuntu-24.04
    if: needs.release.outputs.version != '' && contains(needs.release.outputs.version, '-') == false
    needs:
    - release
    - cargo-build
    steps:

    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: release-notes.md

    - name: gh release create
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh release create
        "v${{ needs.release.outputs.version }}"
        --title "v${{ needs.release.outputs.version }}"
        --notes-file release-notes.md
        --target ${{ github.ref_name }}

    - uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.binary-name }}-${{ needs.release.outputs.version }}-*
        merge-multiple: true

    - name: gh release upload
      run: >
        gh release upload
        "v${{ needs.release.outputs.version }}"
        "${{ inputs.binary-name }}-${{ needs.release.outputs.version }}-"*
        --clobber
        --repo "${{ github.repository }}"
      env:
        GH_TOKEN: ${{ github.token }}

  docker-build:
    runs-on: ${{ matrix.os }}
    if: inputs.docker-image != '' && needs.release.outputs.version != ''
    needs:
    - release
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          arch: amd64
        - os: ubuntu-24.04-arm
          arch: arm64
    steps:

    - uses: actions/checkout@v4

    - name: Restore buildx cache
      id: cache-buildx
      uses: actions/cache/restore@v4
      with:
        path: /tmp/.buildx-cache
        key: buildx-${{ matrix.arch }}-${{ github.run_number }}
        restore-keys: buildx-${{ matrix.arch }}-

    - run: echo $GH_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - run: docker buildx create --use

    - run: >
        docker buildx build .
        --build-arg VERSION=${{ needs.release.outputs.version }}
        --tag ghcr.io/${{ inputs.docker-image }}:${{ needs.release.outputs.version }}-${{ matrix.arch }}
        --cache-from=type=local,src=/tmp/.buildx-cache
        --cache-to=type=local,dest=/tmp/.buildx-cache-new,mode=max
        --push

    # https://github.com/docker/build-push-action/issues/252
    # https://github.com/moby/buildkit/issues/1896
    - run: rm -rf /tmp/.buildx-cache
    - run: mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Delete stale buildx caches
      if: github.ref_name == 'main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh cache list --key buildx-${{ matrix.arch }}- --json key --jq '.[].key' -R ${{ github.repository }} |
        while read -r key; do
          gh cache delete "$key" -R ${{ github.repository }}
        done

    - name: Save buildx cache
      if: github.ref_name == 'main'
      uses: actions/cache/save@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ steps.cache-buildx.outputs.cache-primary-key }}

  docker-scan:
    runs-on: ubuntu-24.04
    if: inputs.docker-image != '' && needs.release.outputs.version != ''
    needs:
    - release
    - docker-build
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
        - arch: arm64
    env:
      IMAGE: ghcr.io/${{ inputs.docker-image }}:${{ needs.release.outputs.version }}-${{ matrix.arch }}
    steps:

    - uses: actions/checkout@v4

    - run: echo $GH_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - run: echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

    - run: /home/linuxbrew/.linuxbrew/bin/brew install syft grype cosign CycloneDX/cyclonedx/cyclonedx-cli

    - name: Generate SBOM
      run: >
        syft ${{ env.IMAGE }}
        --platform linux/${{ matrix.arch }}
        --output cyclonedx-json=syft-sbom.cdx.json

    - name: Merge SBOMs
      if: inputs.sbom != ''
      run: >
        cyclonedx merge
        --input-files syft-sbom.cdx.json ${{ inputs.sbom }}
        --output-file merged-sbom.cdx.json
        --input-format json
        --output-format json
        --output-version v1_6

    - name: Use container SBOM
      if: inputs.sbom == ''
      run: cp syft-sbom.cdx.json merged-sbom.cdx.json

    - name: Vulnerability scan
      run: >
        grype sbom:merged-sbom.cdx.json
        --output table
        --fail-on critical

    - name: Get image digest
      id: digest
      run: |
        DIGEST=$(docker buildx imagetools inspect "${{ env.IMAGE }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

    - name: Attest SBOM
      run: >
        cosign attest
        --predicate merged-sbom.cdx.json
        --type cyclonedx
        --yes
        ghcr.io/${{ inputs.docker-image }}@${{ steps.digest.outputs.digest }}

    - uses: actions/upload-artifact@v4
      with:
        name: sbom-${{ matrix.arch }}
        path: merged-sbom.cdx.json

  docker-release:
    runs-on: ubuntu-24.04
    if: inputs.docker-image != '' && needs.release.outputs.version != ''
    needs:
    - release
    - cargo-build
    - docker-build
    - docker-scan
    steps:

    - run: echo $GH_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create version manifest
      run: >
        docker buildx imagetools create
        --tag ghcr.io/${{ inputs.docker-image }}:${{ needs.release.outputs.version }}
        ghcr.io/${{ inputs.docker-image }}:${{ needs.release.outputs.version }}-amd64
        ghcr.io/${{ inputs.docker-image }}:${{ needs.release.outputs.version }}-arm64

    - name: Tag alpha manifest
      if: github.ref_name == 'main'
      run: >
        docker buildx imagetools create
        --tag ghcr.io/${{ inputs.docker-image }}:alpha
        ghcr.io/${{ inputs.docker-image }}:${{ needs.release.outputs.version }}

    - name: Tag latest manifest
      if: contains(needs.release.outputs.version, '-') == false
      run: >
        docker buildx imagetools create
        --tag ghcr.io/${{ inputs.docker-image }}:latest
        ghcr.io/${{ inputs.docker-image }}:${{ needs.release.outputs.version }}
