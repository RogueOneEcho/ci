name: Fast-forward Release
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
        description: Commit SHA or version tag (e.g. v1.0.0-alpha.1)
    outputs:
      pushed:
        value: ${{ jobs.fast-forward.outputs.pushed }}
        description: Whether the fast-forward push succeeded.
permissions:
  contents: write
  actions: read
jobs:
  fast-forward:
    runs-on: ubuntu-24.04
    outputs:
      pushed: ${{ steps.push.outcome == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:

    - name: Check branch is release
      if: github.ref_name != 'release'
      run: |
        echo "::error::Workflow must be dispatched on the release branch, not ${{ github.ref_name }}"
        exit 1

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Resolve commit
      env:
        INPUT: ${{ inputs.ref }}
      run: |
        if git rev-parse "refs/tags/$INPUT" >/dev/null 2>&1; then
          echo "COMMIT=$(git rev-list -n 1 "refs/tags/$INPUT")" >> "$GITHUB_ENV"
          echo "TAG=$INPUT" >> "$GITHUB_ENV"
        else
          echo "COMMIT=$(git rev-parse "$INPUT")" >> "$GITHUB_ENV"
        fi

    - name: Find version tag
      if: env.TAG == ''
      run: |
        TAG=$(git tag \
          --points-at ${{ env.COMMIT }} \
          --sort=-version:refname \
          'v*' \
        | head -n 1)
        echo "TAG=$TAG" >> "$GITHUB_ENV"

    - name: Check version tag exists
      if: env.TAG == ''
      run: |
        echo "::error::No version tag found on commit ${{ env.COMMIT }}"
        exit 1

    - name: Check commit is on main
      run: git merge-base --is-ancestor ${{ env.COMMIT }} origin/main

    - name: Check fast-forward is possible
      run: git merge-base --is-ancestor origin/release ${{ env.COMMIT }}

    - name: Check no CI runs in progress
      run: |
        RUNS=$(gh run list \
          --commit ${{ env.COMMIT }} \
          --status in_progress \
          --status queued \
          --json databaseId,name \
          --jq '[.[] | select(.databaseId != ${{ github.run_id }})]')
        if [[ $(echo "$RUNS" | jq 'length') != 0 ]]; then
          echo "::error::CI runs still in progress:"
          echo "$RUNS" | jq -r '.[].name'
          exit 1
        fi

    - name: Check no CI runs failed
      run: |
        RUNS=$(gh run list \
          --commit ${{ env.COMMIT }} \
          --status failure \
          --json databaseId,name \
          --jq '[.[] | select(.databaseId != ${{ github.run_id }})]')
        if [[ $(echo "$RUNS" | jq 'length') != 0 ]]; then
          echo "::error::CI runs failed:"
          echo "$RUNS" | jq -r '.[].name'
          exit 1
        fi

    - name: Fast-forward
      id: push
      run: git push origin ${{ env.COMMIT }}:refs/heads/release

    - name: Summary
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
        ```yaml
        tag: ${{ env.TAG }}
        commit: ${{ env.COMMIT }}
        ```
        EOF
