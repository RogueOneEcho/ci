# Docker image with default build context.
# Builds multi-arch (amd64/arm64), scans with SBOM, and pushes to GHCR.
name: On Push
on: push
permissions:
  actions: write
  contents: write
  packages: write
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: RogueOneEcho/ci/.github/workflows/docker.yml@v1
    with:
      docker-image: rogueoneecho/myapp
    secrets: inherit
