# Workspace crate with multiple Cargo.toml files.
# All member Cargo.toml files must be listed so version stamping is applied.
name: CI
on: workflow_call
jobs:
  ci:
    uses: RogueOneEcho/ci/.github/workflows/rust-lib.yml@v1
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_SCRIPT: ${{ secrets.RELEASE_SCRIPT }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    with:
      cargo-manifests: |
        Cargo.toml
        Cargo.lock
        crates/core/Cargo.toml
        crates/macros/Cargo.toml
