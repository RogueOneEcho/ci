# Daily check for upstream image updates.
# Expects the Dockerfile to pin a version via ARG, e.g.:
#   ARG MYAPP_VERSION=v1.2.3
#   FROM upstream/myapp:${MYAPP_VERSION}
# When a new release is found, updates the ARG, commits, and triggers CI.
# Requires GIT_CONFIG secret for commit authorship.
name: Update Dependencies
on:
  schedule:
  # Daily at midnight UTC
  - cron: 0 0 * * *
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  packages: write
  id-token: write
jobs:
  # Ensure this only runs on main
  guard:
    runs-on: ubuntu-24.04
    if: github.ref_name == 'main'
    steps:
    - run: true

  # Compare pinned version in Dockerfile against the latest Docker Hub tag
  check:
    needs: guard
    runs-on: ubuntu-24.04
    outputs:
      latest: ${{ steps.latest.outputs.version }}
      needs_update: ${{ steps.compare.outputs.needs_update }}
    steps:
    - uses: actions/checkout@v6

    - name: Current version
      id: current
      run: |
        version=$(sed -n 's/^ARG MYAPP_VERSION=//p' src/Dockerfile)
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Docker Hub tags are the source of truth for base images. Select the
    # highest semver rather than the most recently pushed tag: upstreams
    # maintain several release branches at once, so `last_updated` order can
    # surface an older branch's patch. Adjust `library/myapp` and the regex
    # (some images prefix tags with `v`) per dependency.
    - name: Latest version
      id: latest
      run: |
        version=$(curl -s "https://hub.docker.com/v2/repositories/library/myapp/tags?page_size=100&ordering=last_updated" | jq -r '[.results[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(split(".") | map(tonumber)) | last')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Variant for deps published only as GitHub releases or Go modules (no
    # image), e.g. a caddy plugin. Swap the step above for:
    #   env:
    #     GH_TOKEN: ${{ github.token }}
    #   run: |
    #     version=$(gh api repos/OWNER/REPO/tags --jq '[.[].name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last')
    #     echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Compare
      id: compare
      run: |
        latest='${{ steps.latest.outputs.version }}'
        current='${{ steps.current.outputs.version }}'
        highest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)
        if [[ "$latest" != "$current" && "$highest" == "$latest" ]]; then
          echo "needs_update=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Summary
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
        ```yaml
        latest: ${{ steps.latest.outputs.version }}
        current: ${{ steps.current.outputs.version }}
        needs_update: ${{ steps.compare.outputs.needs_update }}
        ```
        EOF

  # Update the pinned version, commit, and push
  update:
    needs: check
    if: needs.check.outputs.needs_update == 'true'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Replace
      run: sed -i "s/^ARG MYAPP_VERSION=.*/ARG MYAPP_VERSION=${{ needs.check.outputs.latest }}/" src/Dockerfile

    - name: Configure
      run: ${{ secrets.GIT_CONFIG }}

    - name: List
      run: git config --list

    - name: Stage
      run: git add src/Dockerfile

    - name: Diff
      run: git diff --staged

    - name: Commit
      run: |
        git commit -m 'feat: update myapp to `${{ needs.check.outputs.latest }}`'

    - name: Push
      run: git push

  # Build and publish the updated image
  ci:
    needs: update
    uses: ./.github/workflows/ci.yml
    with:
      ref: main
    secrets: inherit
